apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: memory-autoscale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache-mem
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 25Mi
